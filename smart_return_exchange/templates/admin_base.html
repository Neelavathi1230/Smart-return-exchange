{% extends "base.html" %}
{% block content %}
{% set ep = request.endpoint or '' %}
<div class="d-flex">
    <aside class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="adminSidebar">
        <div class="offcanvas-header d-lg-none border-bottom border-secondary">
            <h6 class="offcanvas-title text-white">Admin Menu</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#adminSidebar"></button>
        </div>
        <div class="offcanvas-body flex-column p-3">
            <div class="text-uppercase small text-secondary fw-semibold mb-2 px-2">Management</div>
            <nav class="nav flex-column">
                <a class="nav-link {{ 'active' if ep == 'admin_dashboard' }}" href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-gauge"></i>Dashboard</a>
                <a class="nav-link {{ 'active' if ep in ('admin_requests', 'admin_request_details') }}" href="{{ url_for('admin_requests') }}"><i class="fa-solid fa-clipboard-list"></i>Requests</a>
                <a class="nav-link {{ 'active' if ep.startswith('admin_product') }}" href="{{ url_for('admin_products') }}"><i class="fa-solid fa-box"></i>Products</a>
                <a class="nav-link {{ 'active' if ep == 'admin_customers' }}" href="{{ url_for('admin_customers') }}"><i class="fa-solid fa-users"></i>Customers</a>
                <a class="nav-link {{ 'active' if ep == 'admin_notifications' }}" href="{{ url_for('admin_notifications') }}"><i class="fa-solid fa-bell"></i>Notifications
                    {% if unread_count %}<span class="badge bg-danger ms-1">{{ unread_count }}</span>{% endif %}</a>
            </nav>
            <div class="text-uppercase small text-secondary fw-semibold mt-4 mb-2 px-2">Account</div>
            <nav class="nav flex-column">
                <a class="nav-link {{ 'active' if ep == 'profile' }}" href="{{ url_for('profile') }}"><i class="fa-solid fa-user-gear"></i>My Profile</a>
                <a class="nav-link" href="{{ url_for('track') }}"><i class="fa-solid fa-location-dot"></i>Track Request</a>
                <a class="nav-link text-danger" href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>
            </nav>
        </div>
    </aside>
    <main class="admin-main">
        {% block page %}{% endblock %}
    </main>
</div>
{% endblock %}
